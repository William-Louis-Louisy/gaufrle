name: P2.1 regenerate lockfile (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lockfile:
    if: github.head_ref == 'feat/p2-1-vite-migration'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Resolve dependencies and generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Export generated lockfile for PR update
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const data = JSON.stringify(JSON.parse(fs.readFileSync('package-lock.json', 'utf8')));
          for (let i = 0; i < data.length; i += 1200) {
            console.log('LOCK_CHUNK:' + String(i / 1200).padStart(5, '0') + ':' + data.slice(i, i + 1200));
          }
          NODE
