name: Validate grids and game sessions

# Run the same checks on every PR: path filters can silently skip tests when
# an unrelated file changes, leaving required checks pending or absent.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# PRs only need to read repository contents; no write token is required.
permissions:
  contents: read

# Keep the most recent run for each PR or branch, avoiding stale checks.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test UTC calendar logic
        run: npm run test:calendar
      - name: Verify every puzzle date
        run: npm run validate:grids

  session:
    name: session
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Test game sessions and UI
        env:
          CI: 'true'
        run: npm test
      - name: Static prerender HTML tests
        run: npm run test:prerender
      - name: PWA cache generation tests
        run: npm run test:pwa
      - name: Production build
        env:
          CI: 'true'
        run: npm run build
