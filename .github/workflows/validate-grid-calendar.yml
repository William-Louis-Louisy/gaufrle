name: Validate grids and game sessions

on:
  pull_request:
    paths:
      - 'src/jsons/*GridList.json'
      - 'scripts/grid-calendar.cjs'
      - 'scripts/reindex-grid-dates.cjs'
      - 'scripts/validate-grid-calendar.cjs'
      - 'scripts/grid-calendar.test.cjs'
      - 'scripts/*hard-grid-candidates*.cjs'
      - 'data/hard-grid-candidates.json'
      - 'src/jsons/DefSevenLetters.json'
      - 'package.json'
      - 'package-lock.json'
      - 'src/pages/*Gamepage.tsx'
      - 'src/hooks/**'
      - 'src/utils/GameSession*'
      - 'src/utils/Scoring*'
      - 'src/components/Victory.test.tsx'
      - 'src/utils/GameMoves.test.ts'
      - 'src/components/GameCell*'
      - 'src/components/GameGrid.tsx'
      - 'src/types/GameCell.ts'
      - 'src/utils/LegacySaveCompatibility.ts'
      - 'src/utils/CellStatus.ts'
      - 'src/utils/GridSchedule*'
      - 'src/utils/PublicationClock*'
      - 'src/components/GridUnavailable.tsx'
      - 'src/components/GridTitle.tsx'
      - 'src/components/CountDown.tsx'
      - 'src/components/Victory.tsx'
      - '.github/workflows/validate-grid-calendar.yml'
  push:
    branches: [main]
    paths:
      - 'src/jsons/*GridList.json'
      - 'scripts/grid-calendar.cjs'
      - 'scripts/reindex-grid-dates.cjs'
      - 'scripts/validate-grid-calendar.cjs'
      - 'scripts/grid-calendar.test.cjs'
      - 'scripts/*hard-grid-candidates*.cjs'
      - 'data/hard-grid-candidates.json'
      - 'src/jsons/DefSevenLetters.json'
      - 'package.json'
      - 'package-lock.json'
      - 'src/pages/*Gamepage.tsx'
      - 'src/hooks/**'
      - 'src/utils/GameSession*'
      - 'src/utils/Scoring*'
      - 'src/components/Victory.test.tsx'
      - 'src/utils/GameMoves.test.ts'
      - 'src/components/GameCell*'
      - 'src/components/GameGrid.tsx'
      - 'src/types/GameCell.ts'
      - 'src/utils/LegacySaveCompatibility.ts'
      - 'src/utils/CellStatus.ts'
      - 'src/utils/GridSchedule*'
      - 'src/utils/PublicationClock*'
      - 'src/components/GridUnavailable.tsx'
      - 'src/components/GridTitle.tsx'
      - 'src/components/CountDown.tsx'
      - 'src/components/Victory.tsx'
      - '.github/workflows/validate-grid-calendar.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test UTC calendar logic
        run: npm run test:calendar
      - name: Verify every puzzle date
        run: npm run validate:grids
      - name: Validate new hard-grid candidates
        run: npm run validate:hard-candidates
      - name: Test reproducible generator and puzzle constraints
        run: npm run test:hard-candidates

  session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Test game sessions
        env:
          CI: 'true'
        run: npm test -- --watch=false --runInBand
      - name: Production build
        env:
          CI: 'true'
        run: npm run build
