name: P3.6 import original artwork (temporary)
on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  import-artwork:
    if: github.head_ref == 'feat/p3-6-offline-secondary-assets' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Download the original 500px assets from Uploadcare
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images
          curl --fail --show-error --silent --location --retry 3 --retry-delay 2 \
            'https://ucarecdn.com/fa67a4fe-58af-4103-a6e8-a57714a8ac07/-/preview/500x500/-/quality/smart/-/format/webp/' \
            --output public/images/not-found.webp
          curl --fail --show-error --silent --location --retry 3 --retry-delay 2 \
            'https://ucarecdn.com/2e1ea5d1-7a00-421b-bba9-d5540a55f236/-/preview/500x500/-/quality/smart/-/format/webp/' \
            --output public/images/support.webp
          for image in public/images/not-found.webp public/images/support.webp; do
            test "$(file --mime-type --brief "$image")" = "image/webp"
            test "$(wc -c < "$image")" -gt 100
            sha256sum "$image"
            file "$image"
          done
      - name: Commit binaries without touching application code
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/not-found.webp public/images/support.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets(p3.6): vendor support and 404 artwork for offline use"
            git push origin HEAD:${{ github.head_ref }}
          fi
