name: P3.1 sync lockfile (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.head_ref == 'chore/p3-1-remove-dead-code' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Remove verified unused dependencies and update npm lockfile
        run: npm uninstall @headlessui/react web-vitals @testing-library/user-event --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean reproducible install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(p3.1): remove unused dependencies and sync lockfile"
            git push origin HEAD:${{ github.head_ref }}
          fi
